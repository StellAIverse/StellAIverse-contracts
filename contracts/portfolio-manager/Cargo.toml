[package]
name = "portfolio-manager"
version = "0.1.0"
description = "Soroban automated portfolio management contract with index fund creation, rebalancing, dividend compounding, and performance tracking"
authors = ["StellAIverse Team"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
