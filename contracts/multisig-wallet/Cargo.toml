[package]
name = "multisig-wallet"
version = "0.1.0"
description = "Soroban multi-signature wallet with nonce ordering, spending limits, and token transfers"
authors = ["StellAIverse Team"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
