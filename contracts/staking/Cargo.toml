[package]
name = "staking"
version = "0.1.0"
description = "Soroban token staking contract with reward distribution, tiered multipliers, and early withdrawal penalties"
authors = ["StellAIverse Team"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
