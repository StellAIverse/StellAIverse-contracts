[package]
name = "token-vesting"
version = "0.1.0"
description = "Soroban token vesting contract with cliffs, batch schedules, and early-exit penalties"
authors = ["StellAIverse Team"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
