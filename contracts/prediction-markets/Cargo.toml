[package]
name = "prediction-markets"
version = "0.1.0"
description = "Prediction markets module for event outcome trading and settlement with CPMM automated market making"
authors = ["StellAIverse Team"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
stellai_lib = { path = "../../lib" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
