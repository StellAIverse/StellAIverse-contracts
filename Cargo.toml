[workspace]
members = [
    "contracts/amm",
    "contracts/collateral-management",
    "contracts/compliance-integration",
    "contracts/cross-chain-bridge",
    "contracts/access-control",
    "contracts/execution-hub",
    "contracts/fee-distribution",
    "contracts/governance",
    "contracts/membership-subscription",
    "contracts/marketplace",
    "contracts/multisig-wallet",
    "contracts/escrow",
    "contracts/staking",
    "contracts/token-vesting",
    "contracts/oracle",
    "contracts/faucet",
    "contracts/bridge",
    "contracts/vault",
    "contracts/portfolio-manager",
    "contracts/prediction-markets",
    "lib",
    "shared",
]

resolver = "2"

[profile.release]
codegen-units = 1
opt-level = 'z'
lto = true
panic = "abort"
debug = false
strip = "symbols"
overflow-checks = true

[profile.release-with-logs]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
codegen-units = 16
opt-level = 0
lto = false
debug = true
incremental = true

[profile.test]
codegen-units = 16
opt-level = 1
lto = false
debug = true
incremental = true



[workspace.dependencies]
soroban-sdk = { version = "=22.0.10", default-features = false }
